reason = "Khoá catalog trong tl!/notify_fmt/notify_tr: tra qua i18n::tr() nên hiển thị 'Nexus PDF' ở mọi ngôn ngữ (test ui_literals_naming_upstream_are_branded_in_every_language); không có http/'/' nên URL không lọt qua"

