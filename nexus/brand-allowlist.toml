[[allow]]
path = "apps/pdfcraft/src/main.rs"
pattern = '(eframe::storage_dir\("PrintCraft"\), eframe::storage_dir\("PdfCraft"\)|d\.join\("PrintCraft"\)\), local\.map\(\|d\| d\.join\("PdfCraft"\)\))'
reason = "Mã di trú PrintCraft→PdfCraft của upstream, không chạy trong bản Nexus (NEXUS_KEEPS_UPSTREAM_FOLDERS): Nexus không đụng thư mục của app upstream"

[[allow]]
path = "apps/pdfcraft/src/decorations.rs"
pattern = '"the Wayland compositor draws no window frames; PdfCraft draws its own title bar"'
reason = "Chỉ là bản ghi log (info) trong file log, không hiện trong giao diện; giữ để không thêm file patch (NỢ nhỏ)"

# ---------------------------------------------------------------------------------------------
# 5. Công cụ dev (xtask), tài liệu parity và PDF trình diễn: không phát hành
# ---------------------------------------------------------------------------------------------

[[allow]]
path = "{xtask/src/assets.rs,xtask/src/screenshots.rs,xtask/src/macos_integration.rs,xtask/src/demo_pdf/annots.rs,xtask/src/demo_pdf/form.rs,xtask/src/demo_pdf/postprocess.rs}"
pattern = '.*'
reason = "cargo xtask: công cụ dev (kiểm tra asset, ảnh README, chẩn đoán macOS, PDF trình diễn), không vào gói phát hành"

[[allow]]
path = "{assets/demo/showcase.html,assets/demo/showcase-data.csv}"
pattern = '.*'
reason = "Nguồn PDF trình diễn của upstream cho cargo xtask demo-pdf (dist/demo), không vào gói phát hành"

[[allow]]
path = "parity/acrobat-features.toml"
pattern = '^notes = ".*"$'
reason = "Ghi chú checklist parity (tài liệu dev, xtask parity đọc), không vào gói phát hành"

[[allow]]
path = "{assets/app-icon/LICENSE-document.txt,LICENSE-document.txt}"
pattern = '^(PdfCraft PDF document icon \(pdfcraft-document\.svg and pdfcraft-document\.ico\)\.|by the PdfCraft contributors\. Copyright \(c\) 2026 PdfCraft contributors\.)$'
reason = "licence text kept verbatim (giấy phép ISC AND (MIT OR Apache-2.0) của icon tài liệu, đóng gói thành LICENSE-document.txt cạnh exe Windows — đường dẫn thứ hai là gốc zip portable mà job check của release quét; phải giữ nguyên chữ ghi bản quyền)"

# ---------------------------------------------------------------------------------------------
# Đồng bộ upstream 2026-10-29: file upstream mới hoặc chuyển chỗ
# ---------------------------------------------------------------------------------------------
[[allow]]
path = "{crates/edit/src/tests.rs,crates/edit/src/marked_isolation_tests.rs}"
pattern = '(\\n)?[qQ] %PdfCraft\\n'
reason = "File test (#[cfg(test)]): dấu bao nội dung `%PdfCraft` giữ như upstream (spec §4.4, khoá định dạng)"

[[allow]]
path = "{crates/annot/src/tests.rs,crates/platform/src/staging/tests.rs,apps/pdfcraft/src/tests.rs,crates/ui-egui/src/platform/macos_association.rs}"
pattern = '(PdfCraft.s own stamps are drawn by `build`|<string>PdfCraft\\n6</string>|github\.com/storytold/"\), "\{name\} must come from the reviewed storytold fork[^"]*"|"PdfCraft patch: [^"]*"|"(/Applications/)?PdfCraft\.app")'
reason = "Dữ liệu và thông điệp assert trong test (#[cfg(test)] / file tests.rs), không phát hành"

[[allow]]
path = "{Cargo.toml,Cargo.lock,deny.toml}"
pattern = 'github\.com/storytold/(egui|winit)(\.git)?'
reason = "Nguồn build: upstream vá egui/winit bằng fork storytold ghim theo rev ([patch.crates-io], cargo-deny allow-git); không vào gói, người dùng không thấy"

[[allow]]
path = ".github/workflows/ci.yml"
pattern = 'github\.com/storytold\b'
reason = "Workflow CI của upstream (kiểm tra nguồn git), không phát hành; Nexus chạy nexus-ci.yml"

[[allow]]
path = ".github/workflows/windows-arm64.yml"
pattern = 'install-relative-path: Programs/ArtCraft/PdfCraft'
reason = "Workflow upstream đã tắt trên fork (spec §4.6)"

[[allow]]
path = "{packaging/windows/install-policy.json,packaging/windows/install-policy.wxi,packaging/windows/check-install-policy.ps1,packaging/windows/INSTALLATION.md}"
pattern = '.*'
reason = "Khung cài đặt install-policy của ArtCraft (upstream, đồng bộ 29/10): MSI Nexus (pdfcraft.wxs của fork) không include/không chạy các file này; NỢ trong BRANDING_PATCH.md"
