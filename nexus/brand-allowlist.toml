# 3. Ghi công upstream (bắt buộc theo giấy phép MIT/Apache; chỉ chữ, không logo, không link)
# ---------------------------------------------------------------------------------------------

[[allow]]
path = "crates/engine/src/nexus.rs"
pattern = '("NexusOffice (is developed from|được phát triển dựa trên)[^"]*"|"Copyright \(c\) the PdfCraft contributors\. MIT OR Apache-2\.0\.")'
