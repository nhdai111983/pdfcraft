# ---------------------------------------------------------------------------------------------
# 2. Khoá/định danh giữ như upstream (spec §4.4: khoá ghi vào file, khoá i18n)
# ---------------------------------------------------------------------------------------------

[[allow]]
path = "crates/edit/src/place.rs"
pattern = 'b"(\\n)?[qQ] %PdfCraft\\n"'
reason = "Chú thích PDF (%...) đánh dấu khối nội dung do app bao: định dạng file, không hiển thị ở đâu; giữ như upstream để file hai bên giống nhau"

[[allow]]
path = "{crates/engine/src/commands.rs,crates/engine/src/links.rs}"
pattern = '"(About PdfCraft|PdfCraft on GitHub)"'
reason = "Nhãn lệnh = khoá catalog: menu/palette tra qua i18n (brand) nên hiện 'About Nexus PDF'/'Nexus PDF on GitHub'; command_list (MCP) đổi qua nexus_label (test command_labels_name_nexus_pdf_and_offer_no_artcraft_links)"

[[allow]]
path = "crates/automation/src/lib.rs"
pattern = 'label\.replace\("PdfCraft", pdfcraft_engine::nexus::APP_NAME\)'
reason = "Chính chỗ đổi tên trong nhãn lệnh tĩnh cho command_list"

